{% extends 'base.html' %}{% block content %}
<div class="container">
<h2>Register</h2>
<form method="POST" onsubmit="return validateRegister()">
<label>Username</label><input id="username" name="username" required>
<label>Email</label><input id="email" name="email" required>
<label>Password</label><input id="password" type="password" name="password" required>
<label>Role</label><select name="role"><option value="farmer">Farmer</option><option value="buyer">Buyer</option></select>
<label>Location</label><input name="location">
<button type="submit">Register</button>
</form>
</div>
{% endblock %}

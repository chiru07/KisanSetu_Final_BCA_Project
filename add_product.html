{% extends 'base.html' %}{% block content %}
<div class="container">
<h2>Add Product</h2>
<form method="POST" onsubmit="return validateProduct()">
<label>Crop Name</label><input id="crop_name" name="crop_name" required>
<label>Category</label><select name="category"><option>Vegetables</option><option>Grains</option><option>Fruits</option><option>Dairy</option></select>
<label>Price</label><input id="price" type="number" step="0.01" name="price" required>
<label>Quantity</label><input name="quantity" placeholder="Example: 10 kg" required>
<label>Description</label><textarea name="description"></textarea>
<button type="submit">Add Product</button>
</form>
</div>
{% endblock %}

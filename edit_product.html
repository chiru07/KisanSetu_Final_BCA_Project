{% extends 'base.html' %}{% block content %}
<div class="container">
<h2>Edit Product</h2>
<form method="POST" onsubmit="return validateProduct()">
<label>Crop Name</label><input id="crop_name" name="crop_name" value="{{ product.crop_name }}" required>
<label>Category</label><select name="category"><option>{{ product.category }}</option><option>Vegetables</option><option>Grains</option><option>Fruits</option><option>Dairy</option></select>
<label>Price</label><input id="price" type="number" step="0.01" name="price" value="{{ product.price }}" required>
<label>Quantity</label><input name="quantity" value="{{ product.quantity }}" required>
<label>Description</label><textarea name="description">{{ product.description }}</textarea>
<button type="submit">Update Product</button>
</form>
</div>
{% endblock %}

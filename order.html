{% extends 'base.html' %}{% block content %}
<div class="container">
<h2>Order Confirmation</h2>
<form method="POST" onsubmit="return confirmPayment()">
<p><b>Crop:</b> {{ product.crop_name }}</p>
<p><b>Farmer:</b> {{ product.farmer_name }}</p>
<label>Price per unit</label><input id="price" value="{{ product.price }}" readonly>
<label>Quantity</label><input id="quantity_ordered" name="quantity_ordered" type="number" value="1" min="1" oninput="updateTotal()" required>
<div class="summary"><h3>Total: <span id="totalDisplay">₹{{ product.price }}</span></h3></div>
<label>Payment Method</label><select name="payment_method"><option>UPI</option><option>Debit Card</option><option>Cash on Delivery</option></select>
<button type="submit">Pay & Place Order</button>
</form>
</div>
{% endblock %}
